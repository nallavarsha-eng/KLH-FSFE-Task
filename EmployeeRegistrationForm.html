<!DOCTYPE html>
<html>
    <head>
        <title>Employee Registration Form</title>
    </head>
    <body bgcolor="lightyellow">
        <h2>Employee Registration Form</h2>
        <form>
            <label>Student name:</label>
            <input type="text" placeholder="Enter your name">
            <br><br>
            <label>Password:</label>
            <input type="password" name="password">
            <br><br>
            <label>Email:</label>
            <input type="email" name="email">
            <br><br>
            <label>Number:</label>
            <input type="number" name="number">
            <br><br>
            <label>Age:</label>
            <input type="number" name="age">
            <br><br>
            <label>Date of birth:</label>
            <input type="date" name="dob">
            <br><br>
            <label>Preferred Interview Time:</label>
            <input type="time" name="time">
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            <label>Skill:</label>
            <input type="checkbox" name="skill">HTML
            <input type="checkbox" name="skill">CSS
            <input type="checkbox" name="skill">Java Script
            <br><br>
            <label>Department:</label>
            <select name="department">
                <option>CSE</option>
                <option>CSIT</option>
                <option>AIDS</option>
                <option>ECE</option>
            </select>
            <br><br>
            <label>Upload Resume:</label>
            <input type="file" name="file">
            <br><br>
            <label>Address:</label>
            <textarea rows="3" cols="30" placeholder="Enter your address"></textarea>
            <br><br>
            <label>Work Experience:</label>
            <input type="range" min="0" max="100">
            <br><br>
            <label>LinkedIn Profile:</label>
            <input type="text" placeholder="Enter LinkedIn URL">
            <br><br>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
            <br><br>
         </form>
    </body>
</html>
